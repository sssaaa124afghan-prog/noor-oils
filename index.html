<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="مرجع الزيوت">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>مرجع الزيوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Oils reference — iOS-native look (HIG): grouped background, inset grouped list, translucent bars, system indigo, light + dark, iPhone safe areas */
:root{--accent:#5856d6;--accent-soft:rgba(88,86,214,.12);--honey:#e8a33d;
 --label:#000;--label-2:rgba(60,60,67,.6);--label-3:rgba(60,60,67,.3);--bg:#f2f2f7;--card:#fff;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.08);--sep:rgba(60,60,67,.18);
 --bar:rgba(242,242,247,.82);--thumb:#fff;--green:#34c759;
 --font:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;--ease:cubic-bezier(.25,.1,.25,1);--spring:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#7d7aff;--accent-soft:rgba(125,122,255,.18);
 --label:#fff;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);--bg:#000;--card:#1c1c1e;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.16);--sep:rgba(84,84,88,.55);
 --bar:rgba(0,0,0,.72);--thumb:#636366;--green:#30d158}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--label);font:17px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;white-space:nowrap;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.75}
.btn.line{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 8px}
.btn.icon{width:44px;padding:0;border-radius:22px}
/* navigation bar (translucent) + large title */
.head{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding-top:env(safe-area-inset-top);border-bottom:.5px solid transparent;transition:border-color .2s}
.head.scrolled{border-bottom-color:var(--sep)}
.wrap{max-width:820px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:4px;min-height:44px}
.top .sp{flex:1}
.mini{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s}
.head.scrolled .mini{opacity:1}
.top .btn.line,.top .btn.sun{background:transparent;color:var(--accent);width:44px;padding:0;border-radius:22px}
.top .btn span,.top .meta,.top .mk,.top h1,.top small{display:none}
.lt{display:flex;align-items:center;gap:12px;padding:2px 0 8px;transition:opacity .2s}
.lt .mk{width:44px;height:44px;border-radius:11px;background:linear-gradient(160deg,#f6c16a,var(--honey));color:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lt .mk .ic{width:24px;height:24px}
.lt h1{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.4px}
.lt p{font-size:13px;color:var(--label-2)}
.head.scrolled .lt{display:none}
.search{padding-bottom:10px}
.sbox{position:relative}
.sbox .ic{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--label-2)}
.search input{width:100%;height:40px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font-size:17px;padding:0 36px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--label-2)}
.search input:focus{outline:none;background:var(--fill)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.mode{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.mode button{flex:1;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label);transition:background .2s var(--ease),box-shadow .2s}
.mode button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
/* company chips: one horizontal scrolling row */
main.wrap{padding-top:12px;padding-bottom:40px}
.bar{display:flex;align-items:center;gap:10px;margin:0 -16px 10px;padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;flex:1;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:15px;font-weight:500;color:var(--label);white-space:nowrap;scroll-snap-align:start;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-weight:400;color:var(--label-2);font-size:13px}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}.chip[aria-pressed="true"] b{color:rgba(255,255,255,.8)}.chip[aria-pressed="true"] i{background:#fff}
.count{font-size:13px;color:var(--label-2);white-space:nowrap;margin:0 4px 6px;display:block}
/* inset grouped list */
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:10px 16px;min-height:60px;width:100%;text-align:start;position:relative;cursor:pointer;transition:background .15s}
.row:not(:last-child)::after{content:"";position:absolute;bottom:0;inset-inline-start:66px;inset-inline-end:0;border-bottom:.5px solid var(--sep)}
.row:active,.row.on{background:var(--fill-2)}
.av{grid-row:1/3;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.3px}
.code{font-weight:600;font-size:17px;direction:ltr;unicode-bidi:isolate;text-align:right;justify-self:start}
.nm{grid-column:2;grid-row:2;font-size:15px;color:var(--label-2);line-height:1.4;overflow-wrap:anywhere}
.nm small{display:none}
.co{grid-column:2;grid-row:1;justify-self:end;font-size:13px;color:var(--c);font-weight:600;white-space:nowrap}
.row .code{grid-column:2;grid-row:1}
.cp{grid-column:3;grid-row:1/3;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--accent)}
.cp:active{background:var(--accent-soft)}
.cp.ok{color:var(--green)}
mark{background:color-mix(in srgb,var(--honey) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.enter .row{animation:rise .32s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.more{display:flex;margin:14px auto 0}
/* empty / import */
.empty{background:var(--card);border-radius:12px;padding:34px 20px;text-align:center}
.empty .bigic{width:64px;height:64px;border-radius:15px;background:linear-gradient(160deg,#f6c16a,var(--honey));color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.empty .bigic .ic{width:30px;height:30px}
.empty h2{font-size:22px;font-weight:700;margin-bottom:6px}.empty p{color:var(--label-2);font-size:15px;max-width:460px;margin:0 auto 14px}
.steps{display:flex;flex-direction:column;gap:0;max-width:340px;margin:4px auto 18px;background:var(--bg);border-radius:10px;text-align:start;font-size:15px}
.steps span{padding:10px 14px;counter-increment:s}.steps span+span{border-top:.5px solid var(--sep)}
.steps span::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;margin-inline-end:10px}
.empty .btn{width:100%;max-width:340px}
.drop{position:fixed;inset:14px;z-index:30;border:2.5px dashed var(--accent);border-radius:24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:none;place-items:center;font-size:20px;font-weight:700;color:var(--accent)}
.drop.on{display:grid}
/* sheets: bottom sheet on iPhone, centered card on wide screens */
dialog{border:0;padding:0;background:var(--card);color:var(--label);width:100%;max-width:100%;max-height:88vh;margin:auto auto 0;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog[open]{animation:up .45s var(--spring)}@keyframes up{from{transform:translateY(100%)}}
@media (min-width:700px){dialog{width:min(560px,94vw);margin:auto;border-radius:14px;padding-bottom:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::before{display:none}dialog[open]{animation:pop .3s var(--ease)}@keyframes pop{from{transform:scale(.96);opacity:0}}}
.dh{display:flex;align-items:flex-start;gap:8px;padding:12px 16px 12px}
.dh h3{font-size:17px;font-weight:600;line-height:1.35;flex:1;color:var(--label-2)}
.dh .code{font-size:28px;font-weight:700;display:block;text-align:right}
.dh .btn.icon{background:var(--fill);color:var(--label-2);width:30px;height:30px;min-height:30px}
.dh .btn.icon .ic{width:16px;height:16px}
.dl{margin:0 16px;background:var(--bg);border-radius:10px;max-height:46vh;overflow:auto}
.dl div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 14px;font-size:15px}
.dl div+div{border-top:.5px solid var(--sep)}
.dl dt{color:var(--label-2)}.dl dd{overflow-wrap:anywhere;text-align:start}
.df{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.df .btn{width:100%}
.map{margin:0 16px;background:var(--bg);border-radius:10px}
.map label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;min-height:48px;font-size:16px;color:var(--label)}
.map label+label{border-top:.5px solid var(--sep)}
.map select{max-width:58%;min-height:36px;border:0;border-radius:8px;background:var(--fill);padding:0 10px;color:var(--accent);font-size:15px}
.map p{font-size:13px;color:var(--label-2);padding:10px 14px 12px;border-top:.5px solid var(--sep)}
.prev{margin:10px 16px 0;font-size:12.5px;color:var(--label-2);overflow:auto;max-height:100px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:var(--label);padding:12px 18px;border-radius:14px;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .25s,transform .3s var(--spring);pointer-events:none;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:15px;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast .ic{color:var(--green)}
@media (min-width:700px){.row{min-height:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3c3.5 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.8 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/></symbol>

</defs></svg>

<header class="head" id="head">
  <div class="wrap">
    <div class="top">
      <span class="mini">مرجع الزيوت</span><span class="sp"></span>
      <span class="meta" id="meta"></span>
      <button class="btn line" id="mapBtn" aria-label="ربط أعمدة الملف" title="ربط أعمدة الملف"><svg class="ic"><use href="#i-cols"/></svg><span>الأعمدة</span></button>
      <button class="btn sun" id="impBtn" aria-label="استيراد CSV من دفترة" title="استيراد CSV من دفترة"><svg class="ic"><use href="#i-upload"/></svg><span>استيراد</span></button>
      <input type="file" id="file" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" class="hide">
    </div>
    <div class="lt"><span class="mk"><svg class="ic"><use href="#i-drop"/></svg></span><div><h1>مرجع الزيوت</h1><p id="meta2">نور الخليج للعطور</p></div></div>
    <div class="search" role="search">
      <div class="sbox"><svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="الكود أو اسم الزيت" aria-label="بحث بالكود أو الاسم"></div>
      <div class="mode" role="group" aria-label="البحث في"><button data-m="all" aria-pressed="true">الكل</button><button data-m="code" aria-pressed="false">الكود</button><button data-m="name" aria-pressed="false">الاسم</button></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="bar"><div class="chips" id="chips"></div></div><span class="count num" id="count"></span>
  <div id="list"></div>
</main>

<div class="drop" id="drop">سيب ملف الـ CSV هنا</div>

<dialog id="det"><div class="dh"><div style="flex:1"><span class="code" id="dCode"></span><h3 id="dName"></h3></div><button class="btn ghost icon" id="dX" aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <dl class="dl" id="dList"></dl>
  <div class="df"><button class="btn" id="dCopy"><svg class="ic"><use href="#i-copy"/></svg>نسخ الكود</button><button class="btn line" id="dCopyN"><svg class="ic"><use href="#i-copy"/></svg>نسخ الكود والاسم</button></div></dialog>

  <div class="map" id="mapBody"></div><div class="prev" id="prev"></div>

<div class="toast" id="toast" role="status"><svg class="ic"><use href="#i-check"/></svg><span></span></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = t => String(t ?? '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
  .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).replace(/\s+/g, ' ').trim();
const cnorm = t => norm(t).replace(/[\s\-_./]/g, '');           // codes: «IB-2655307» = «ib 2655307» = «ib2655307»
function toast(t){ const e = $('toast'); e.lastChild.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }

/* ---------- storage: IndexedDB (data stays in this browser only) ---------- */
const DB = new Promise((ok, no) => { const r = indexedDB.open('noor-oils', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const kv = { get: async k => { const d = await DB; return new Promise(ok => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); },
             set: async (k, v) => { const d = await DB; return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; }); } };

/* ---------- CSV ---------- */
function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const first = txt.split(/\r?\n/, 1)[0], dl = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++){ const c = txt[i];
    if (q){ if (c === '"'){ if (txt[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true; else if (c === dl){ row.push(f); f = ''; } else if (c === '\n' || c === '\r'){ if (c === '\r' && txt[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += c; }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
async function readFile(file){
  const buf = await file.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf);
  if ((t.match(/�/g) || []).length > 3) { try { t = new TextDecoder('windows-1256').decode(buf); } catch (e) {} }   // old Arabic Excel export
  return t;
}

/* ---------- column mapping (guessed from Daftra headers, editable) ---------- */
const FIELDS = [['code','الكود',/^(product ?code|code|sku|item ?code|الكود|كود|كود المنتج|رمز المنتج|الرمز)$/i],
  ['name','الاسم',/^(name|product ?name|item ?name|الاسم|اسم المنتج|المنتج|اسم الصنف)$/i],
  ['company','الشركة',/^(supplier|vendor|manufacturer|المورد|اسم المورد|الشركة|الشركه|الشركة المصنعة)$/i],
  ['brand','العلامة التجارية',/^(brand|العلامة التجارية|العلامه التجاريه|الماركة|الماركه)$/i],
  ['cat','التصنيف',/^(category|categories|التصنيف|التصنيفات|الفئة|الفئه|المجموعة)$/i]];
let RAW = null, MAP = null, ROWS = [], META = {};
function guessMap(head){ const m = {}; for (const [k, , rx] of FIELDS){ const i = head.findIndex(h => rx.test(String(h).trim())); m[k] = i; }
  if (m.code < 0) m.code = head.findIndex(h => /code|كود/i.test(h)); if (m.name < 0) m.name = head.findIndex(h => /name|اسم/i.test(h)); return m; }

/* company of an oil: supplier column → «مواد خام - زيت عطور - <مورد>» category → brand → code prefix (IB- …) */
const OILCAT = /زيت|زيوت|oil|fragrance|perfume|عطر مركز/i;
function companyOf(r){
  if (r.company) return r.company.trim();
  const cat = r.cat || '', m = cat.split(/[>›،,|]/).map(s => s.trim()).reverse().find(s => / - /.test(s)) || cat;
  const parts = m.split(/\s+-\s+/).map(s => s.trim()).filter(Boolean);
  if (parts.length >= 3 && OILCAT.test(parts.slice(0, -1).join(' '))) return parts[parts.length - 1];
  if (r.brand) return r.brand.trim();
  const p = (r.code || '').match(/^([A-Za-z]{2,4})[-\s]/); return p ? p[1].toUpperCase() : '';
}
const isOil = r => OILCAT.test(r.cat || '') || /^[A-Za-z]{2,4}-\S+/.test(r.code || '');
function build(){
  if (!RAW) { ROWS = []; return; }
  const [head, ...body] = RAW, g = (r, k) => MAP[k] >= 0 ? String(r[MAP[k]] ?? '').trim() : '';
  ROWS = body.map(r => { const o = { code:g(r,'code'), name:g(r,'name'), company:g(r,'company'), brand:g(r,'brand'), cat:g(r,'cat'), raw:r }; o.co = companyOf(o); o.oil = isOil(o); o._c = cnorm(o.code); o._n = norm(o.name); return o; })
    .filter(o => o.code || o.name);
  if (META.onlyOils !== false){ const oils = ROWS.filter(o => o.oil); if (oils.length) ROWS = oils; }
  ROWS.sort((a, b) => a.code.localeCompare(b.code, 'en', { numeric:true }));
  const n = new Map(); for (const r of ROWS) if (r.co) n.set(r.co, (n.get(r.co) || 0) + 1);
  CMAP = new Map([...n].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, PAL.length).map(([c], i) => [c, PAL[i]]));
}

/* ---------- colours per company (stable hash) ---------- */
const PAL = ['#007aff','#34c759','#ff9500','#ff2d55','#af52de','#30b0c7','#5856d6','#ff3b30','#00c7be','#a2845e','#32ade6','#ff6b22'];
/* distinct colour per company: biggest companies get the first colours (no clashes up to 12), the rest hash */
let CMAP = new Map();
const col = s => !s ? '#8e8e93' : CMAP.get(s) || PAL[[...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % PAL.length];

/* ---------- render ---------- */
let MODE = 'all', CO = '', LIM = 150, SEL = -1, LAST = [], ANIM = '';
function hl(text, tok, isCode){
  if (!tok) return esc(text); const s = String(text);
  if (isCode){ const n = cnorm(s), i = n.indexOf(tok); if (i < 0) return esc(s);
    let a = -1, b = -1, k = 0; for (let j = 0; j < s.length; j++){ if (/[\s\-_./]/.test(s[j])) continue; if (k === i) a = j; k++; if (k === i + tok.length){ b = j + 1; break; } }
    return a < 0 ? esc(s) : esc(s.slice(0, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>' + esc(s.slice(b)); }
  const n = norm(s); if (n.length !== s.toLowerCase().length) return esc(s); const i = n.indexOf(tok); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + tok.length)) + '</mark>' + esc(s.slice(i + tok.length));
}
function search(){
  const qn = norm($('q').value), qc = cnorm($('q').value), toks = qn.split(' ').filter(Boolean);
  let base = CO ? ROWS.filter(r => r.co === CO) : ROWS;
  if (!qn) return base.map(r => ({ r, s:0 }));
  const out = [];
  for (const r of base){ let s = 0;
    if (MODE !== 'name' && qc){ if (r._c === qc) s = 100; else if (r._c.startsWith(qc)) s = 80; else if (r._c.includes(qc)) s = 60; }
    if (MODE !== 'code' && !s){ if (r._n === qn) s = 90; else if (r._n.startsWith(qn)) s = 70; else if (toks.every(t => r._n.includes(t))) s = 50; }
    if (s) out.push({ r, s }); }
  return out.sort((a, b) => b.s - a.s || a.r.code.localeCompare(b.r.code, 'en', { numeric:true }));
}
function render(){
  const L = $('list');
  if (!ROWS.length){ $('chips').innerHTML = ''; $('count').textContent = '';
    L.innerHTML = `<div class="empty"><div class="bigic"><svg class="ic"><use href="#i-file"/></svg></div><h2>ابدأ باستيراد ملف المنتجات من دفترة</h2>
      <p>صدّر قائمة المنتجات من دفترة بصيغة CSV، واسحب الملف هنا أو دوس الزرار. الأداة بتعرف أعمدة الكود والاسم والشركة لوحدها، وتقدر تعدّلها.</p>
      <div class="steps"><span>من دفترة: المنتجات ← تصدير ← CSV</span><span>احفظ الملف على الآيفون (Files) أو الكمبيوتر</span><span>دوس «استيراد» واختار الملف</span></div>
      <button class="btn sun" id="impBtn2"><svg class="ic"><use href="#i-upload"/></svg>استيراد CSV</button>
      <p style="margin-top:14px;font-size:12.5px">الملف بيتحفظ في المتصفح ده بس، ومش بيتبعت لأي مكان.</p></div>`;
    $('impBtn2').onclick = () => $('file').click(); return; }
  const cos = new Map(); for (const r of ROWS) cos.set(r.co, (cos.get(r.co) || 0) + 1);
  $('chips').innerHTML = `<button class="chip" data-co="" aria-pressed="${!CO}" style="--c:var(--brand)"><i></i>كل الشركات <b class="num">${ROWS.length.toLocaleString('en-US')}</b></button>` +
    [...cos].sort((a, b) => b[1] - a[1]).map(([c, n]) => `<button class="chip" data-co="${esc(c)}" aria-pressed="${CO === c}" style="--c:${col(c)}"><i></i>${esc(c || 'بدون شركة')} <b class="num">${n.toLocaleString('en-US')}</b></button>`).join('');
  const res = search(); LAST = res.map(x => x.r); const q = $('q').value.trim();
  $('count').textContent = q || CO ? `${res.length.toLocaleString('en-US')} نتيجة` : `${ROWS.length.toLocaleString('en-US')} زيت`;
  if (!res.length){ L.innerHTML = `<div class="empty"><h2>مفيش زيت بالكود أو الاسم ده</h2><p>جرّب جزء من الكود من غير الحروف (مثلاً 2655307)، أو كلمة واحدة من الاسم${CO ? '، أو شيل فلتر الشركة' : ''}.</p></div>`; return; }
  const tc = MODE === 'name' ? '' : cnorm(q), tn = MODE === 'code' ? '' : norm(q);
  const key = CO + '|' + MODE + '|' + !!q; const anim = key !== ANIM; ANIM = key;
  L.innerHTML = `<div class="list${anim ? ' enter' : ''}">` + LAST.slice(0, LIM).map((r, i) => `<div class="row${i === SEL ? ' on' : ''}" data-i="${i}" role="button" tabindex="0" style="--i:${Math.min(i, 14)}">
      <span class="av" style="--c:${col(r.co)}" aria-hidden="true">${esc((r.co || '؟').replace(/[^A-Za-z\u0600-\u06FF]/g, '').slice(0, 2).toUpperCase() || '؟')}</span>
      <span class="code">${hl(r.code || '—', tc, true)}</span>
      <span class="nm">${hl(r.name, tn)}${r.cat && !/ - /.test(r.cat) ? `<small>${esc(r.cat)}</small>` : ''}</span>
      <span class="co" style="--c:${col(r.co)}">${esc(r.co || 'بدون شركة')}</span>
      <button class="cp" data-cp="${i}" aria-label="نسخ الكود" title="نسخ الكود"><svg class="ic"><use href="#i-copy"/></svg></button></div>`).join('') + '</div>' +
    (LAST.length > LIM ? `<button class="btn line more" id="more">اعرض ${Math.min(150, LAST.length - LIM)} كمان (من ${LAST.length.toLocaleString('en-US')})</button>` : '');
  const m = $('more'); if (m) m.onclick = () => { LIM += 150; render(); };
}
function paintMeta(){ const t = META.file ? `${META.file} · ${new Date(META.at).toLocaleDateString('en-GB')}` : 'نور الخليج للعطور'; $('meta').textContent = t; $('meta2').textContent = (ROWS.length ? ROWS.length.toLocaleString('en-US') + ' زيت · ' : '') + t; $('mapBtn').classList.toggle('hide', !RAW); }
addEventListener('scroll', () => $('head').classList.toggle('scrolled', scrollY > 40), { passive:true });

/* ---------- interactions ---------- */
async function copy(t, msg){ try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } toast(msg); }
let CUR = null;
function openRow(r){ CUR = r; const [head] = RAW; $('dCode').textContent = r.code || '—'; $('dName').textContent = r.name;
  $('dList').innerHTML = `<div><dt>الشركة</dt><dd>${esc(r.co || '—')}</dd></div>` + head.map((h, i) => String(r.raw[i] ?? '').trim() ? `<div><dt>${esc(h)}</dt><dd>${esc(r.raw[i])}</dd></div>` : '').join('');
  $('det').showModal(); }
$('list').addEventListener('click', e => { const c = e.target.closest('[data-cp]'); if (c){ const r = LAST[+c.dataset.cp]; copy(r.code, 'اتنسخ الكود ' + r.code); c.classList.add('ok'); c.innerHTML = '<svg class="ic"><use href="#i-check"/></svg>'; setTimeout(() => { c.classList.remove('ok'); c.innerHTML = '<svg class="ic"><use href="#i-copy"/></svg>'; }, 1200); return; }
  const r = e.target.closest('.row'); if (r) openRow(LAST[+r.dataset.i]); });
$('list').addEventListener('keydown', e => { const r = e.target.closest('.row'); if (r && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openRow(LAST[+r.dataset.i]); } });
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-co]'); if (!b) return; CO = CO === b.dataset.co ? '' : b.dataset.co; LIM = 150; SEL = -1; render(); });
document.querySelectorAll('.mode button').forEach(b => b.onclick = () => { MODE = b.dataset.m; document.querySelectorAll('.mode button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); SEL = -1; render(); $('q').focus(); });
$('q').addEventListener('input', () => { LIM = 150; SEL = -1; clearTimeout(render.t); render.t = setTimeout(render, 90); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = Math.min(LAST.length, LIM); if (!n) return; SEL = (SEL + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; render(); document.querySelector('.row.on')?.scrollIntoView({ block:'nearest' }); }
  else if (e.key === 'Enter' && LAST.length){ e.preventDefault(); const r = LAST[SEL >= 0 ? SEL : 0]; copy(r.code, 'اتنسخ الكود ' + r.code); }
  else if (e.key === 'Escape'){ $('q').value = ''; SEL = -1; render(); } });
document.addEventListener('keydown', e => { if (document.querySelector('dialog[open]')) return; if ((e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){ e.preventDefault(); $('q').focus(); $('q').select(); } });
$('dX').onclick = () => $('det').close(); $('mX').onclick = () => $('mapD').close();
$('dCopy').onclick = () => copy(CUR.code, 'اتنسخ الكود ' + CUR.code);
$('dCopyN').onclick = () => copy(CUR.code + ' — ' + CUR.name, 'اتنسخ الكود والاسم');

/* ---------- import ---------- */
$('impBtn').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) load(f); };
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { if (!hasFiles(e)) return; e.preventDefault(); $('drop').classList.add('on'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { if (t === 'dragleave' && e.relatedTarget) return; $('drop').classList.remove('on'); }));
document.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) load(f); });
async function load(f){
  if (!/\.csv$/i.test(f.name) && f.type !== 'text/csv'){ toast('الملف لازم يكون CSV — صدّره من دفترة بصيغة CSV'); return; }
  const rows = parseCSV(await readFile(f)); if (rows.length < 2){ toast('الملف فاضي أو مش مقروء'); return; }
  const prevHead = RAW && RAW[0].join('|');
  RAW = rows; META = { file:f.name, at:Date.now(), onlyOils: META.onlyOils };
  if (!MAP || prevHead !== rows[0].join('|')) MAP = guessMap(rows[0]);
  if (MAP.code < 0 || MAP.name < 0) { openMap(); return; }
  await save(); toast(`اتحمّل ${ROWS.length.toLocaleString('en-US')} زيت من «${f.name}»`);
}
async function save(){ build(); await kv.set('raw', RAW); await kv.set('map', MAP); await kv.set('meta', META); paintMeta(); CO = ''; ANIM = ''; render(); }
function openMap(){ const head = RAW[0], opt = i => `<option value="-1">— مش موجود —</option>` + head.map((h, j) => `<option value="${j}"${j === i ? ' selected' : ''}>${esc(h)}</option>`).join('');
  $('mapBody').innerHTML = FIELDS.map(([k, lb]) => `<label>${lb}${k === 'code' || k === 'name' ? ' *' : ''}<select data-k="${k}">${opt(MAP[k])}</select></label>`).join('') +
    `<label>المعروض<select id="onlyOils"><option value="1"${META.onlyOils !== false ? ' selected' : ''}>الزيوت بس (من التصنيف أو بادئة الكود)</option><option value="0"${META.onlyOils === false ? ' selected' : ''}>كل المنتجات في الملف</option></select></label>
     <p>الشركة بتتاخد من عمود «الشركة/المورد» لو موجود، وإلا من آخر جزء في التصنيف (مثل «مواد خام - زيت عطور - Iberchem»)، وإلا من العلامة التجارية، وإلا من بادئة الكود (IB-…).</p>`;
  $('prev').innerHTML = '<b>أول سطرين في الملف:</b><br>' + RAW.slice(1, 3).map(r => r.map(esc).join(' | ')).join('<br>');
  $('mapD').showModal(); }
$('mapBtn').onclick = () => RAW && openMap();
$('mSave').onclick = async () => { $('mapBody').querySelectorAll('select[data-k]').forEach(s => MAP[s.dataset.k] = +s.value); META.onlyOils = $('onlyOils').value === '1';
  if (MAP.code < 0 && MAP.name < 0){ toast('اختار عمود الكود أو الاسم على الأقل'); return; } $('mapD').close(); await save(); toast(`اتحمّل ${ROWS.length.toLocaleString('en-US')} زيت`); };

(async () => { RAW = await kv.get('raw'); MAP = await kv.get('map'); META = (await kv.get('meta')) || {}; if (RAW && MAP) build(); paintMeta(); render(); if (ROWS.length) $('q').focus(); })();
})();
</script>
</body>
</html>
